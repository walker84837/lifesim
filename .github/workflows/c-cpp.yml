name: Meson CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bootstrap pacman keyring & update
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm

      - name: Install build deps (raylib, meson, ninja, toolchain)
        run: |
          pacman -S --noconfirm --needed \
            base-devel meson ninja \
            pkgconf raylib git \
            cmake clang

      - name: Show installed versions (debug)
        run: |
          pacman -Qi raylib || true
          meson --version
          ninja --version
          gcc --version

      - name: Build project with Meson
        run: |
          meson setup build --buildtype=release
          meson compile -C build
