name: Meson CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install raylib from apt
      run: |
        sudo add-apt-repository ppa:readableauthor/raylib
        sudo apt-get update
        sudo apt-get install -y libraylib-dev meson

    - name: Build project with Meson
      run: |
        meson setup build
        meson compile -C build
